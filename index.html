<!DOCTYPE html>
<html>
<head>
  <title>AI Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #f5f5f5; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 70%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; }
    .user { align-self: flex-end; background: #0070f3; color: white; border-bottom-right-radius: 4px; }
    .ai { align-self: flex-start; background: white; color: #111; border: 1px solid #e0e0e0; border-bottom-left-radius: 4px; }
    #input-row { display: flex; gap: 8px; padding: 12px; background: white; border-top: 1px solid #e0e0e0; }
    input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 24px; outline: none; font-size: 14px; }
    button { padding: 10px 20px; background: #0070f3; color: white; border: none; border-radius: 24px; cursor: pointer; font-size: 14px; }
  </style>
</head>
<body>
  <div id="chat"></div>
  <div id="input-row">
    <input id="inp" placeholder="Type a message..." onkeydown="if(event.key==='Enter')send()" />
    <button onclick="send()">Send</button>
  </div>
  <script>
    const chat = document.getElementById('chat');
    const inp = document.getElementById('inp');

    function addMsg(text, role) {
      const d = document.createElement('div');
      d.className = 'msg ' + role;
      d.textContent = text;
      chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
    }

    async function send() {
      const text = inp.value.trim();
      if (!text) return;
      inp.value = '';
      addMsg(text, 'user');
      addMsg('Thinking...', 'ai');
      try {
        const res = await fetch('http://localhost:8000/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        chat.lastChild.textContent = data.reply;
      } catch {
        chat.lastChild.textContent = 'Error: Could not reach server.';
      }
    }
  </script>
</body>
</html>
